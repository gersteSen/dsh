<div class="flex min-h-full">
  <div class="flex flex-1 flex-col justify-center px-4 py-12 sm:px-6 lg:flex-none lg:px-20 xl:px-24">
    <div class="mx-auto w-full max-w-sm lg:w-96">
      <div>
        <img [src]="'images/dsh-logo.png'" alt="Drumschule Harsch Logo" class="sidebar__logo" />
        <h2 class="mt-8 heading-white-md">GrooveDesk Harsch</h2>
      </div>

      <div class="mt-10">
        <div>
          <div class="space-y-6">
            <div>
              <div class="mt-2">
                <dsh-basic-input placeholder="Email" />
              </div>
            </div>

            <div>
              <div class="mt-2">
                <dsh-basic-input placeholder="Password" type="password" />
              </div>
            </div>

            <div class="flex items-center justify-between">
              <div class="text-sm/6">
                <a href="#" class="right text-condensed hover:text-secondary">Passwort vergessen?</a>
              </div>
            </div>

            <div>
              <dsh-icon-button (clickEvent)="navigateToDashboard()" label="Login" icon="login" [iconAndLabelButton]="true" />
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <div class="relative hidden w-0 flex-1 lg:block">
    <img [src]="'images/login-bg.jpg'" alt="" class="absolute inset-0 size-full object-cover" />
  </div>
</div>
