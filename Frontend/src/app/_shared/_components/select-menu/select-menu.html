<!-- Natives Select für Mobile -->
<select class="sm:hidden w-full rounded-md bg-primary-800 px-3 py-2 text-sm text-primary-300 border border-primary-600"
        (change)="selectItem(items()[$any($event.target).selectedIndex - 1])"
        [value]="selectedItem()?.label ?? ''">
  <option value="" disabled selected>{{ placeholder() }}</option>
  @for (item of items(); track $index) {
    <option [value]="item.label" [selected]="selectedItem() === item">{{ item.label }}</option>
  }
</select>

<!-- Custom Dropdown für Desktop -->
<el-select name="selected" value="published" class="hidden sm:inline-block relative">
  <div class="inline-flex divide-x divide-primary-600 rounded-md outline-hidden">
    <div class="inline-flex items-center gap-x-1.5 rounded-l-md bg-primary-800 px-3 py-2 text-primary-300">
      @if (selectedItem()) {
        <svg viewBox="0 0 20 20" fill="currentColor" data-slot="icon" aria-hidden="true" class="-ml-0.5 size-5">
          <path
            d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z"
            clip-rule="evenodd" fill-rule="evenodd"/>
        </svg>
      } @else {
        {{ placeholder() }}
      }
      <el-selectedcontent class="text-sm text-primary-300">{{ selectedItem()?.label }}</el-selectedcontent>
    </div>
    <button (click)="showItems()" type="button" aria-label="Change published status"
            class="inline-flex items-center rounded-l-none rounded-r-md bg-primary-800 p-2 hover:bg-primary-400 focus-visible:outline-2 focus-visible:outline-primary-400">
      <svg viewBox="0 0 20 20" fill="currentColor" data-slot="icon" aria-hidden="true"
           class="size-5 text-primary-300 forced-colors:text-[Highlight]">
        <path
          d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"
          clip-rule="evenodd" fill-rule="evenodd"/>
      </svg>
    </button>
  </div>

  <el-options [class]="{'hidden': showOptions()}"
              class="max-w-72 origin-top-right divide-y divide-artisan-border overflow-hidden rounded-md bg-gray-800 outline-1 -outline-offset-1 outline-white/10 data-leave:transition data-leave:transition-discrete data-leave:duration-100 data-leave:ease-in data-closed:data-leave:opacity-0">
    @for (item of items(); track $index) {
      <el-option (click)="selectItem(item)"
                 class="group/option block cursor-pointer hover:bg-primary-200 dark:hover:bg-primary-900 p-4 text-sm text-primary-600 dark:text-primary-400 select-none focus:bg-primary-500 focus:text-white focus:outline-hidden">
        <div class="flex flex-col">
          <div class="flex justify-between">
            <p class="font-normal group-aria-selected/option:font-semibold in-[el-selectedcontent]:font-semibold">
              {{ item.label }}</p>
            <span
              class="text-primary-400 group-not-aria-selected/option:hidden group-focus/option:text-white in-[el-selectedcontent]:hidden">
              <svg viewBox="0 0 20 20" fill="currentColor" data-slot="icon" aria-hidden="true" class="size-5">
                <path
                  d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z"
                  clip-rule="evenodd" fill-rule="evenodd"/>
              </svg>
            </span>
          </div>
        </div>
      </el-option>
    }
  </el-options>
</el-select>
