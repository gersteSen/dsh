<button (click)="navigateToTeacher()"
        class="flex flex-col items-start h-112.5 cursor-pointer text-left w-64 overflow-hidden bg-surface shadow-xl hover:shadow hover:shadow-primary relative">

  <!-- Profilbild -->
  <div class="w-full">
    <img [src]="avatarImage()" [alt]="teacher().fullName ?? ''" class="w-full h-64 object-cover object-top" />
  </div>

  <!-- Inhalt -->
  <div class="px-5 pt-4 pb-5">

    <!-- Name -->
    <h3 class="heading-dark-md ">
      {{ teacher().firstName }} {{ teacher().lastName }}
    </h3>

    <!-- Titel / Status -->
    <p class="text-condensed text-sm mb-4 flex gap-4">
      @for(instrument of activeInstruments(); track instrument.id) {
      <dsh-chip [label]="instrument.name!" />
      }
    </p>

    <!-- Beschreibung -->
    <p class="text-white text-sm leading-relaxed mb-5">
      Dabei seit {{ teacher().activeSince?.slice(0, 4) }}.
      Unterrichtet mit Begeisterung und langjähriger Erfahrung.
    </p>

  </div>

</button>
