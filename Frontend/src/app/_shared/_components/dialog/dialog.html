<dialog class="grid grid-cols-1 content-center fixed top-0 left-0 h-full w-full open:backdrop-blur-sm bg-gray-800/20" open>

    <section class="w-100 md:min-w-225 h-auto mx-auto bg-general-bg  p-8 shadow-md flex flex-col gap-2">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="heading-dark-md">{{dialogData().title}}</h1>
            </div>
            <dsh-icon-button icon="close" classes="bg-general-bg text-white" (clickEvent)="onClick()" />
        </div>
        <div>
            <ng-content />
        </div>
    </section>
</dialog>
